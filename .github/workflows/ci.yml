name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.12.10" }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: uv sync --locked --group dev
      - run: DATABASE_URL=sqlite:////tmp/shuttleup-ci.db uv run alembic -c backend/alembic.ini upgrade head
      - run: uv run pytest backend/tests plugins/astrbot_plugin_shuttleup/tests
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run test:unit -- --run
      - run: npm --prefix frontend run build

