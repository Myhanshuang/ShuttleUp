[project]
name = "shuttleup"
version = "1.0.0"
description = "Coordinate badminton sessions from availability to settlement"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.5,<2",
  "argon2-cffi>=25.1.0,<26",
  "email-validator>=2.2,<3",
  "fastapi>=0.116.1,<0.117",
  "httpx>=0.28.1,<1",
  "pydantic-settings>=2.10.1,<3",
  "sqlalchemy>=2.0.43,<3",
  "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4.2,<9",
  "pytest-asyncio>=1.1.0,<2",
  "pytest-cov>=6.2.1,<7",
]

[project.scripts]
shuttleup = "shuttleup.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/shuttleup"]

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["backend/tests", "plugins/astrbot_plugin_shuttleup/tests"]
